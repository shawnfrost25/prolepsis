services:
  db:
    image: "postgres:18"
    container_name: "prolepsis-db"
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - prolepsis_db:/var/lib/postgresql
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      PGUSER: "${PGUSER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    env_file:
      - path: ".env"
        required: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 10s
      retries: 3
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - 8080:8080
    volumes:
      - prolepsis_backend:/var/log/mimi
    env_file:
      - path: ".env"
        required: false
    depends_on:
      db:
        condition: service_healthy

volumes:
  prolepsis_db: