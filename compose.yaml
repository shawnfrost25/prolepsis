services:
  db:
    image: "postgres:18"
    container_name: "prolepsis-db"
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - prolepsis_db:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      PGUSER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: prolepsis_lab
    env_file:
      - ".env"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d prolepsis_lab -U postgres"]
      interval: 5s
      timeout: 10s
      retries: 3

volumes:
  prolepsis_db: