syntax = "proto3";

package pdf;

message PdfRequest {
// We get everything from Golang's middleware
  string user_id = 1;
  string user_ip = 2;
  string method = 3;
  string path = 4;
  string role = 5;
// We get everything from Golang's middleware
  string trace = 6;
}

message PdfResponse {
  string pdf_title =1;
  string pdf_content = 2;
}

service PdfService {
  rpc PdfRPC (PdfRequest) returns (PdfResponse);
}