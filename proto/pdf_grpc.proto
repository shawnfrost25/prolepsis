syntax = "proto3";

package pdf;

option go_package = "prolepsis/internal/pb/pdf";

import "common.proto";

message PdfRequest {
  common.RequestContext ctx = 1;
  string raw_pdf = 2;
}

message PdfResponse {
  string pdf_title =1;
  string pdf_content = 2;
}

service PdfService {
  rpc PdfRPC (PdfRequest) returns (PdfResponse);
}